-- Desktop widget: day, date, time and a row of stats.
-- Drawn on the wallpaper of the primary monitor, so open windows cover it.

conky.config = {
    -- Position. The widget is 720px wide and its contents are centred in it,
    -- so its midpoint sits at gap_x + 360 from the left edge of the screen.
    -- 152 puts the midpoint 20% of the way across a 2560px-wide monitor.
    alignment = 'top_left',
    gap_x = 152,
    gap_y = 170,
    xinerama_head = 0,
    minimum_width = 720,
    maximum_width = 720,

    update_interval = 1,
    double_buffer = true,
    cpu_avg_samples = 2,
    no_buffers = true,
    short_units = true,
    pad_percents = 2,

    own_window = true,
    own_window_type = 'override',
    own_window_transparent = true,
    own_window_argb_visual = false,

    use_xft = true,
    font = 'JetBrains Mono:size=10',
    default_color = 'a8b0b3',
    color1 = 'f2f2f2',
    color2 = '7f8c90',
    color3 = '22d3ee',

    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,
}

conky.text = [[
${alignc}${font League Mono Condensed UltraLight:size=60}${color1}${execi 30 date +%A | tr '[:lower:]' '[:upper:]' | sed 's/./& /g; s/ $//'}${font}
${voffset 18}${alignc}${font JetBrains Mono Light:size=12}${color}${execi 30 date '+%d %B %Y' | tr '[:lower:]' '[:upper:]' | sed 's/./& /g; s/ $//'}${font}
${voffset 24}${alignc}${font Roboto Thin:size=44}${color1}${time %H:%M:%S}${font}
${voffset 26}${alignc}${font JetBrains Mono:size=10}${color2}CPU ${color1}${cpu cpu0}%${color2}       MEM ${color1}${mem}${color2}       GPU ${color1}${execi 5 sh -c 'nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader,nounits 2>/dev/null || echo --'}%${color2}       DISK ${color1}${fs_used_perc /}%${font}
]]
