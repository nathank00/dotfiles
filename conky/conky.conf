-- Desktop widget: day, date, time and a row of stats.
-- Drawn on the wallpaper of the primary monitor, so open windows cover it.

conky.config = {
    alignment = 'top_middle',
    gap_x = 0,
    gap_y = 72,
    xinerama_head = 0,
    minimum_width = 900,
    maximum_width = 900,

    update_interval = 1,
    double_buffer = true,
    cpu_avg_samples = 2,
    no_buffers = true,
    short_units = true,
    pad_percents = 2,

    own_window = true,
    own_window_type = 'override',
    own_window_transparent = true,
    own_window_argb_visual = false,

    use_xft = true,
    font = 'JetBrains Mono:size=11',
    default_color = 'a8b0b3',
    color1 = 'f2f2f2',
    color2 = '7f8c90',
    color3 = '22d3ee',

    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,
}

conky.text = [[
${alignc}${font JetBrains Mono Thin:size=76}${color1}${execi 30 date +%A | tr '[:lower:]' '[:upper:]' | sed 's/./& /g; s/ $//'}${font}
${voffset 22}${alignc}${font JetBrains Mono Light:size=15}${color}${execi 30 date '+%d %B %Y' | tr '[:lower:]' '[:upper:]' | sed 's/./& /g; s/ $//'}${font}
${voffset 30}${alignc}${font JetBrains Mono ExtraLight:size=46}${color1}${time %H:%M:%S}${font}
${voffset 34}${alignc}${font JetBrains Mono:size=12}${color2}CPU ${color1}${cpu cpu0}%${color2}       MEM ${color1}${mem}${color2}       GPU ${color1}${execi 5 sh -c 'nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader,nounits 2>/dev/null || echo --'}%${color2}       DISK ${color1}${fs_used_perc /}%${font}
]]
